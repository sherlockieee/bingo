<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bingo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #fff5ec;
        --bg-2: #ffe4d6;
        --bg-3: #f6d4ff;
        --ink: #2b1d2a;
        --ink-soft: #6b5560;
        --card: #ffffff;
        --line: rgba(43, 29, 42, 0.08);
        --accent: #e7546f;
        --accent-soft: #ffd9e0;
        --gold: #f4a93b;
        --done: linear-gradient(135deg, #ff8a9b 0%, #ffb37a 100%);
        --shadow-sm: 0 1px 2px rgba(43, 29, 42, 0.06),
          0 4px 12px rgba(43, 29, 42, 0.04);
        --shadow-md: 0 6px 24px rgba(43, 29, 42, 0.1),
          0 2px 6px rgba(43, 29, 42, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(
            1200px 600px at 10% -10%,
            var(--bg-3) 0%,
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 110% 10%,
            var(--bg-2) 0%,
            transparent 55%
          ),
          var(--bg-1);
        background-attachment: fixed;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 56px 24px 80px;
      }

      header {
        text-align: center;
        margin-bottom: 36px;
      }

      .eyebrow {
        font-family: "Fraunces", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        color: var(--accent);
        letter-spacing: 0.02em;
        font-size: 18px;
        margin: 0 0 6px;
      }

      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 800;
        font-size: clamp(48px, 8vw, 84px);
        line-height: 1;
        margin: 0;
        letter-spacing: -0.02em;
      }

      h1 .year {
        background: linear-gradient(135deg, #e7546f 0%, #f4a93b 60%, #b66bff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        margin: 12px auto 0;
        max-width: 480px;
        color: var(--ink-soft);
        font-size: 15px;
        line-height: 1.55;
      }

      .tabs {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }

      .tab {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-soft);
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid var(--line);
        padding: 8px 20px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background 0.18s ease,
          color 0.18s ease;
      }

      .tab:hover {
        background: #fff;
      }

      .tab[aria-selected="true"] {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .progress {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        padding: 8px 14px;
        border-radius: 999px;
        box-shadow: var(--shadow-sm);
      }

      .progress-bar {
        width: 140px;
        height: 6px;
        background: var(--accent-soft);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--gold));
        border-radius: 999px;
        transition: width 0.4s ease;
      }

      .progress-text {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-soft);
        min-width: 64px;
        text-align: right;
      }

      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        padding: 9px 16px;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.12s ease,
          background 0.18s ease,
          color 0.18s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        background: #fff;
      }

      .toolbar-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn.danger:hover {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(6px);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 14px;
        box-shadow: var(--shadow-md);
      }

      .cell {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 16px;
        background: var(--card);
        border: 1px solid var(--line);
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease,
          background 0.25s ease;
        overflow: hidden;
      }

      .cell:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .cell .text {
        font-size: clamp(11px, 1.5vw, 14px);
        line-height: 1.3;
        font-weight: 500;
        color: var(--ink);
        word-break: break-word;
        max-height: 100%;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 5;
        -webkit-box-orient: vertical;
      }

      .cell .text.placeholder {
        color: var(--ink-soft);
        font-style: italic;
        font-weight: 400;
        opacity: 0.5;
      }

      .cell.done {
        background: var(--done);
        border-color: transparent;
      }

      .cell.done .text {
        color: #fff;
        font-weight: 600;
      }

      .cell.done::after {
        content: "✓";
        position: absolute;
        top: 8px;
        right: 10px;
        font-size: 14px;
        color: #fff;
        opacity: 0.85;
      }

      .cell.free {
        background: linear-gradient(135deg, #fff7e6 0%, #fce4ff 100%);
        border-color: transparent;
      }

      .cell.free .text {
        font-family: "Fraunces", serif;
        font-style: italic;
        font-weight: 600;
        color: var(--accent);
        font-size: clamp(13px, 1.7vw, 16px);
      }

      .cell textarea {
        position: absolute;
        inset: 8px;
        border: none;
        outline: none;
        resize: none;
        background: transparent;
        font: inherit;
        font-size: clamp(11px, 1.5vw, 14px);
        line-height: 1.3;
        font-weight: 500;
        color: var(--ink);
        text-align: center;
        padding: 4px;
      }

      .cell.has-photo {
        background-size: cover;
        background-position: center;
        border-color: transparent;
        align-items: flex-end;
      }

      .cell.has-photo::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.7);
      }

      .cell.done.has-photo::before {
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.45) 0%,
          rgba(0, 0, 0, 0) 45%
        );
      }

      .cell.has-photo .text {
        position: relative;
      }

      .cell.done.has-photo .text {
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      }

      .edit-btn {
        position: absolute;
        top: 6px;
        left: 6px;
        z-index: 1;
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 24px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .cell:hover .edit-btn,
      .edit-btn:focus-visible,
      .cell.has-note .edit-btn {
        opacity: 1;
      }

      .cell.has-note .edit-btn {
        background: var(--accent);
        color: #fff;
      }

      @media (hover: none) {
        .edit-btn {
          opacity: 0.8;
        }
      }

      .detail {
        width: min(440px, calc(100vw - 32px));
        border: none;
        border-radius: 20px;
        padding: 22px;
        color: var(--ink);
        background: var(--card);
        box-shadow: var(--shadow-md);
      }

      .detail::backdrop {
        background: rgba(43, 29, 42, 0.45);
      }

      .detail label {
        display: block;
        margin: 14px 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-soft);
      }

      .detail input[type="text"],
      .detail textarea {
        width: 100%;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 9px 12px;
        background: var(--bg-1);
      }

      .detail textarea {
        min-height: 96px;
        resize: vertical;
      }

      .detail .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
      }

      .detail .check input {
        margin: 0;
      }

      .photo-preview {
        height: 150px;
        border-radius: 12px;
        border: 1px dashed var(--line);
        background-color: var(--bg-1);
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-soft);
        font-size: 13px;
      }

      .photo-preview:not(.empty) span {
        display: none;
      }

      .photo-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .detail-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .hint {
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
        color: var(--ink-soft);
      }

      .hint kbd {
        font-family: ui-monospace, "SF Mono", monospace;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 11px;
        margin: 0 2px;
      }

      .celebrate {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 50;
      }

      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(720deg);
          opacity: 0;
        }
      }

      .confetti {
        position: absolute;
        top: -20px;
        width: 10px;
        height: 14px;
        border-radius: 2px;
        animation: fall linear forwards;
      }


      @media (max-width: 560px) {
        .wrap {
          padding: 32px 14px 48px;
        }
        .grid {
          gap: 8px;
          padding: 10px;
          border-radius: 20px;
        }
        .cell {
          border-radius: 12px;
          padding: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <p class="eyebrow">things to chase</p>
        <h1>Bingo <span class="year" id="yearTitle">2026</span></h1>
        <p class="subtitle">
          Twenty-five things to chase. Click any tile to mark it
          done. Double-click to edit.
        </p>
      </header>

      <div class="tabs" id="tabs" role="tablist"></div>

      <div class="toolbar">
        <div class="progress" aria-label="Progress">
          <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
          <span class="progress-text" id="progressText">0 / 25</span>
        </div>
        <div class="toolbar-actions">
          <button class="btn" id="shareBtn">Share link</button>
          <button class="btn" id="devicesBtn">My other devices</button>
          <button class="btn danger" id="deleteBtn">Delete board</button>
          <button class="btn danger" id="resetBtn">Reset board</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>

      <p class="hint">
        <kbd>click</kbd> to toggle done · <kbd>double-click</kbd> to rename ·
        <kbd>✎</kbd> to add a photo or note ·
        <span id="syncStatus">loading…</span>
      </p>
    </div>

    <dialog class="detail" id="detail">
      <form id="detailForm">
        <label for="detailTitle">Tile</label>
        <input type="text" id="detailTitle" maxlength="80" />

        <label class="check">
          <input type="checkbox" id="detailDone" /> Done
        </label>

        <label for="detailNote">What happened</label>
        <textarea id="detailNote" maxlength="1000"></textarea>

        <label>Photo (becomes the tile background)</label>
        <div class="photo-preview empty" id="photoPreview">
          <span>No photo yet</span>
        </div>
        <div class="photo-actions">
          <button type="button" class="btn" id="photoPick">Choose photo</button>
          <button type="button" class="btn danger" id="photoRemove" hidden>
            Remove
          </button>
          <input type="file" id="photoInput" accept="image/*" hidden />
        </div>

        <div class="detail-actions">
          <button type="button" class="btn" id="detailCancel">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>

    <div class="celebrate" id="celebrate" aria-hidden="true"></div>

    <script>
      const GRID_SIZE = 25;
      const FREE_INDEX = 12;
      const ACTIVE_BOARD_KEY = "bingo-active-board";
      const SPACE_KEY = "bingo-space-id";
      const V1_HOME_KEY = "bingo-board-id";
      const LEGACY_YEARS_KEY = "bingo-years";
      const FIRST_YEAR = "2026";
      const POLL_MS = 15000;
      const MAX_TAB_NAME = 40;
      const API_BASE =
        location.hostname === "sherlockieee.github.io" ? "https://bingo-five-dun.vercel.app" : "";

      let spaceId = null;
      let boards = [];
      let activeId = null;
      let state = null;

      const cacheKey = () => `bingo-space-cache-${spaceId}`;
      const claimedKey = (id) => `bingo-claimed-${id}`;
      const legacyStateKey = (y) => `bingo-${y}-v2`;
      const legacyPhotoDbName = (y) => `bingo-${y}-photos`;
      const activeBoard = () => boards.find((b) => b.id === activeId);
      const currentYear = () => String(new Date().getFullYear());

      const WINNING_LINES = (() => {
        const lines = [];
        for (let r = 0; r < 5; r++) {
          lines.push([0, 1, 2, 3, 4].map((c) => r * 5 + c));
        }
        for (let c = 0; c < 5; c++) {
          lines.push([0, 1, 2, 3, 4].map((r) => r * 5 + c));
        }
        lines.push([0, 6, 12, 18, 24]);
        lines.push([4, 8, 12, 16, 20]);
        return lines;
      })();

      function lineKey(line) {
        return line.join(",");
      }

      const defaultItems = [
        "Niagara Falls",
        "New place in the US",
        "Ski / snowboard for the first time",
        "Salsa class in my basement",
        "Present in front of my company",
        "Grow 1 plant",
        "Babysit for a day",
        "Psychedelic meditation retreat",
        "New country in Europe",
        "Commune month",
        "Plan a family date ♥",
        "175 lbs deadlift / squat",
        "Bingo day ✦",
        "50 mile bike ride",
        "Broadway show",
        "5 Substack posts",
        "Host 5 dinners / events in NYC",
        "Make $500 from the internet (w/ Claude)",
        "Read 50 books",
        "Food tour!! (w/ friends)",
        "Plan a date for Chris",
        "Laser tag",
        "New country in Asia",
        "Do 1 pull-up!",
        "Go to a martial art class",
      ];

      const cellsFromTexts = (texts) =>
        texts.map((text) => ({ text, done: false, note: "", photo: null }));

      function blankCells() {
        return cellsFromTexts(
          Array.from({ length: GRID_SIZE }, (_, i) =>
            i === FREE_INDEX ? "Bingo day ✦" : "",
          ),
        );
      }

      function readJson(key) {
        try {
          return JSON.parse(localStorage.getItem(key));
        } catch (e) {
          return null;
        }
      }

      function stateFor(board) {
        const claimed = readJson(claimedKey(board.id));
        return {
          cells: structuredClone(board.cells),
          claimedLines: Array.isArray(claimed) ? claimed : [],
        };
      }

      function saveClaimed() {
        localStorage.setItem(claimedKey(activeId), JSON.stringify(state.claimedLines));
      }

      async function api(path, params, options = {}) {
        const query = new URLSearchParams(params).toString();
        const res = await fetch(`${API_BASE}/api/${path}?${query}`, options);
        if (!res.ok) {
          const error = new Error(`${path} failed: ${res.status}`);
          error.status = res.status;
          throw error;
        }
        return res.json();
      }

      const postJson = (path, params, body) =>
        api(path, params, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

      const postBoard = (id, body) => postJson("board", { id }, { ...body, space: spaceId });
      const postSpace = (body) => postJson("space", { space: spaceId }, body);
      const fetchSpace = () => api("space", { space: spaceId });

      async function uploadPhoto(boardId, blob) {
        const { path } = await api(
          "photo",
          { id: boardId },
          { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob },
        );
        return path;
      }

      const photoSrc = (path) =>
        `${API_BASE}/api/photo?id=${activeId}&path=${encodeURIComponent(path)}`;

      let writeChain = Promise.resolve();
      let writesInFlight = 0;

      /** Queues a write so this device's saves reach the server one at a time, in order. */
      function queueWrite(id, body) {
        writesInFlight++;
        setStatus("saving…");
        const snapshot = structuredClone(body);
        writeChain = writeChain.then(async () => {
          try {
            const saved = await postBoard(id, snapshot);
            if (writesInFlight === 1) {
              applySpace({ boards: boards.map((b) => (b.id === saved.id ? saved : b)) });
            }
            setStatus("synced");
          } catch (e) {
            setStatus("couldn't save — check your connection");
          } finally {
            writesInFlight--;
          }
        });
        return writeChain;
      }

      function saveCell(i) {
        saveClaimed();
        return queueWrite(activeId, { cells: { [i]: state.cells[i] } });
      }

      function saveAllCells() {
        saveClaimed();
        return queueWrite(activeId, { cells: state.cells, replace: true });
      }

      const grid = document.getElementById("grid");
      const fill = document.getElementById("fill");
      const progressText = document.getElementById("progressText");
      const resetBtn = document.getElementById("resetBtn");
      const celebrate = document.getElementById("celebrate");

      const LEGACY_PHOTO_STORE = "photos";
      const PHOTO_MAX_EDGE = 900;

      /** Returns the photos this browser stored for `y` before sync, keyed by tile index. */
      async function loadLegacyPhotos(y) {
        try {
          const db = await new Promise((resolve, reject) => {
            const req = indexedDB.open(legacyPhotoDbName(y), 1);
            req.onupgradeneeded = () => req.result.createObjectStore(LEGACY_PHOTO_STORE);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
          return await new Promise((resolve, reject) => {
            const store = db.transaction(LEGACY_PHOTO_STORE).objectStore(LEGACY_PHOTO_STORE);
            const keys = store.getAllKeys();
            const blobs = store.getAll();
            blobs.onsuccess = () =>
              resolve(new Map(keys.result.map((k, i) => [k, blobs.result[i]])));
            blobs.onerror = () => reject(blobs.error);
          });
        } catch (e) {
          return new Map();
        }
      }

      async function downscale(file) {
        const bitmap = await createImageBitmap(file, {
          imageOrientation: "from-image",
        });
        const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.82));
      }

      function render() {
        grid.innerHTML = "";
        state.cells.forEach((cell, i) => {
          const el = document.createElement("div");
          el.className = "cell";
          if (i === FREE_INDEX && !cell.done) el.classList.add("free");
          if (cell.done) el.classList.add("done");
          if (cell.note) el.classList.add("has-note");
          if (cell.photo) {
            el.classList.add("has-photo");
            el.style.backgroundImage = `url("${photoSrc(cell.photo)}")`;
          }
          el.dataset.index = i;

          const editBtn = document.createElement("button");
          editBtn.className = "edit-btn";
          editBtn.type = "button";
          editBtn.title = "Add a photo or note";
          editBtn.setAttribute("aria-label", "Edit tile details");
          editBtn.textContent = "✎";
          el.appendChild(editBtn);

          const text = document.createElement("div");
          text.className = "text";
          if (cell.text) {
            text.textContent = cell.text;
          } else {
            text.textContent = "tap to add…";
            text.classList.add("placeholder");
          }
          el.appendChild(text);
          grid.appendChild(el);
        });
        updateProgress();
      }

      function updateCell(i) {
        const cell = state.cells[i];
        const el = grid.children[i];
        if (!el) return;
        el.classList.toggle("done", !!cell.done);
        el.classList.toggle("free", i === FREE_INDEX && !cell.done);
        const textEl = el.querySelector(".text");
        if (textEl && !el.querySelector("textarea")) {
          if (cell.text) {
            textEl.textContent = cell.text;
            textEl.classList.remove("placeholder");
          } else {
            textEl.textContent = "tap to add…";
            textEl.classList.add("placeholder");
          }
        }
      }

      grid.addEventListener("click", (e) => {
        if (e.target.tagName === "TEXTAREA") return;
        const cellEl = e.target.closest(".cell");
        if (!cellEl || !grid.contains(cellEl)) return;
        const i = Number(cellEl.dataset.index);
        if (Number.isNaN(i)) return;
        if (e.target.closest(".edit-btn")) {
          openDetail(i);
          return;
        }
        const cell = state.cells[i];
        if (!cell.text) {
          startEdit(cellEl, i);
          return;
        }
        cell.done = !cell.done;
        const newBingos = reconcileBingos();
        saveCell(i);
        updateCell(i);
        updateProgress();
        if (cell.done) burstFromCell(i);
        if (newBingos.length > 0) bigCelebrate();
      });

      function isLineComplete(line) {
        return line.every((idx) => state.cells[idx].done);
      }

      function reconcileBingos() {
        const completedKeys = new Set(
          WINNING_LINES.filter(isLineComplete).map(lineKey),
        );
        state.claimedLines = state.claimedLines.filter((k) =>
          completedKeys.has(k),
        );
        const claimedSet = new Set(state.claimedLines);
        const newBingos = [];
        for (const line of WINNING_LINES) {
          const k = lineKey(line);
          if (completedKeys.has(k) && !claimedSet.has(k)) {
            state.claimedLines.push(k);
            newBingos.push(line);
          }
        }
        return newBingos;
      }

      grid.addEventListener("dblclick", (e) => {
        const cellEl = e.target.closest(".cell");
        if (!cellEl || !grid.contains(cellEl)) return;
        e.preventDefault();
        const i = Number(cellEl.dataset.index);
        if (Number.isNaN(i)) return;
        startEdit(cellEl, i);
      });

      function startEdit(el, i) {
        if (el.querySelector("textarea")) return;
        const ta = document.createElement("textarea");
        ta.value = state.cells[i].text || "";
        ta.maxLength = 80;
        const textEl = el.querySelector(".text");
        if (textEl) textEl.style.visibility = "hidden";
        el.appendChild(ta);
        ta.focus();
        ta.select();

        let finished = false;
        const finish = (commit) => {
          if (finished) return;
          finished = true;
          if (commit) {
            state.cells[i].text = ta.value.trim();
            saveCell(i);
          }
          ta.remove();
          if (textEl) textEl.style.visibility = "";
          updateCell(i);
        };
        ta.addEventListener("blur", () => finish(true));
        ta.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            ta.blur();
          } else if (e.key === "Escape") {
            ta.value = state.cells[i].text || "";
            finish(false);
          }
        });
      }

      function updateProgress() {
        const total = GRID_SIZE;
        const done = state.cells.filter((c) => c.done).length;
        const pct = (done / total) * 100;
        fill.style.width = pct + "%";
        progressText.textContent = `${done} / ${total}`;
      }

      function allDone() {
        return state.cells.every((c) => c.done);
      }

      const colors = ["#e7546f", "#f4a93b", "#b66bff", "#5fc9c1", "#ff8a9b"];

      function burstFromCell(i) {
        const cellEl = grid.children[i];
        const rect = cellEl.getBoundingClientRect();
        for (let k = 0; k < 14; k++) {
          spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.4);
        }
      }

      function bigCelebrate() {
        for (let k = 0; k < 120; k++) {
          spawnConfetti(
            Math.random() * window.innerWidth,
            -20 - Math.random() * 200,
            3 + Math.random() * 2,
          );
        }
      }

      function spawnConfetti(x, y, duration) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = x + "px";
        c.style.top = y + "px";
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.transform = `translate(${(Math.random() - 0.5) * 60}px, 0) rotate(${Math.random() * 360}deg)`;
        c.style.animationDuration = duration + "s";
        celebrate.appendChild(c);
        setTimeout(() => c.remove(), duration * 1000 + 100);
      }

      const detail = document.getElementById("detail");
      const detailForm = document.getElementById("detailForm");
      const detailTitle = document.getElementById("detailTitle");
      const detailDone = document.getElementById("detailDone");
      const detailNote = document.getElementById("detailNote");
      const photoPreview = document.getElementById("photoPreview");
      const photoInput = document.getElementById("photoInput");
      const photoPick = document.getElementById("photoPick");
      const photoRemove = document.getElementById("photoRemove");
      const detailCancel = document.getElementById("detailCancel");

      let editing = null;

      function showPreview(url) {
        photoPreview.style.backgroundImage = url ? `url("${url}")` : "";
        photoPreview.classList.toggle("empty", !url);
        photoRemove.hidden = !url;
      }

      function releasePreviewUrl() {
        if (editing && editing.previewUrl) URL.revokeObjectURL(editing.previewUrl);
        if (editing) editing.previewUrl = null;
      }

      function openDetail(i) {
        const cell = state.cells[i];
        editing = { i, newPhoto: null, removePhoto: false, previewUrl: null };
        detailTitle.value = cell.text || "";
        detailDone.checked = !!cell.done;
        detailNote.value = cell.note || "";
        showPreview(cell.photo ? photoSrc(cell.photo) : null);
        detail.showModal();
      }

      photoPick.addEventListener("click", () => photoInput.click());

      photoInput.addEventListener("change", async () => {
        const file = photoInput.files[0];
        photoInput.value = "";
        if (!file || !editing) return;
        try {
          const blob = await downscale(file);
          releasePreviewUrl();
          editing.newPhoto = blob;
          editing.removePhoto = false;
          editing.previewUrl = URL.createObjectURL(blob);
          showPreview(editing.previewUrl);
        } catch (e) {
          alert("Couldn't read that photo. Try a JPEG or PNG.");
        }
      });

      photoRemove.addEventListener("click", () => {
        releasePreviewUrl();
        editing.newPhoto = null;
        editing.removePhoto = true;
        showPreview(null);
      });

      detailCancel.addEventListener("click", () => detail.close());
      detail.addEventListener("close", () => {
        releasePreviewUrl();
        editing = null;
      });

      detailForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const { i, newPhoto, removePhoto } = editing;
        const cell = state.cells[i];
        try {
          if (newPhoto) cell.photo = await uploadPhoto(activeId, newPhoto);
          else if (removePhoto) cell.photo = null;
        } catch (err) {
          alert("Couldn't upload the photo. Check your connection and try again.");
          return;
        }
        cell.text = detailTitle.value.trim();
        cell.done = detailDone.checked;
        cell.note = detailNote.value.trim();
        const newBingos = reconcileBingos();
        detail.close();
        saveCell(i);
        render();
        if (cell.done) burstFromCell(i);
        if (newBingos.length > 0) bigCelebrate();
      });

      resetBtn.addEventListener("click", () => {
        if (!confirm("Reset this board? This clears progress, notes and photos for everyone with the link.")) return;
        state = { cells: blankCells(), claimedLines: [] };
        saveAllCells();
        render();
      });

      const tabsEl = document.getElementById("tabs");
      const yearTitle = document.getElementById("yearTitle");
      const syncStatus = document.getElementById("syncStatus");
      const shareBtn = document.getElementById("shareBtn");
      const deleteBtn = document.getElementById("deleteBtn");
      const devicesBtn = document.getElementById("devicesBtn");

      function setStatus(text) {
        syncStatus.textContent = text;
      }

      function renderTabs() {
        tabsEl.innerHTML = "";
        boards.forEach((b) => {
          const tab = document.createElement("button");
          tab.className = "tab";
          tab.type = "button";
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-selected", b.id === activeId);
          tab.textContent = b.name;
          tab.addEventListener("click", () => switchBoard(b.id));
          tabsEl.appendChild(tab);
        });
        const add = document.createElement("button");
        add.className = "tab";
        add.type = "button";
        add.textContent = "+";
        add.title = "Add a board";
        add.addEventListener("click", addBoard);
        tabsEl.appendChild(add);
      }

      function pickBoard() {
        const saved = localStorage.getItem(ACTIVE_BOARD_KEY);
        return boards.some((b) => b.id === saved) ? saved : (boards[0]?.id ?? null);
      }

      function showBoard() {
        const board = activeBoard();
        renderTabs();
        if (!board) return;
        state = stateFor(board);
        reconcileBingos();
        yearTitle.textContent = board.name;
        document.title = `Bingo ${board.name}`;
        deleteBtn.textContent = board.mine ? "Delete board" : "Remove from my tabs";
        history.replaceState(null, "", `#b=${board.id}`);
        render();
      }

      function switchBoard(id) {
        activeId = id;
        localStorage.setItem(ACTIVE_BOARD_KEY, id);
        showBoard();
      }

      const isEditing = () => detail.open || !!grid.querySelector("textarea");

      function applySpace(next) {
        if (isEditing()) return;
        const same = JSON.stringify(next.boards) === JSON.stringify(boards);
        if (same && activeBoard()) return;
        boards = next.boards;
        localStorage.setItem(cacheKey(), JSON.stringify(boards));
        if (!activeBoard()) activeId = pickBoard();
        showBoard();
      }

      async function poll() {
        if (document.hidden || writesInFlight > 0) return;
        try {
          const next = await fetchSpace();
          if (writesInFlight > 0) return;
          applySpace(next);
          setStatus("synced");
        } catch (e) {
          setStatus("offline — showing the last copy this device saw");
        }
      }

      const ID = /^[A-Za-z0-9_-]{16,64}$/;
      const validId = (id) => (id && ID.test(id) ? id : null);

      function newId() {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        return btoa(String.fromCharCode(...bytes))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }

      /** Makes a board, adds it to this space's tabs and opens it. */
      async function createBoard(name, cells, id = newId()) {
        await postBoard(id, { create: { name, cells } });
        const next = await postSpace({ add: id });
        activeId = id;
        localStorage.setItem(ACTIVE_BOARD_KEY, id);
        applySpace(next);
      }

      async function addBoard() {
        const input = prompt("Name your new board (a year, or anything, like Ha & Chris)");
        const name = input && input.trim().slice(0, MAX_TAB_NAME);
        if (!name) return;
        try {
          await createBoard(name, blankCells());
        } catch (e) {
          alert("Couldn't make the board. Check your connection and try again.");
        }
      }

      deleteBtn.addEventListener("click", async () => {
        const board = activeBoard();
        if (!board) return;
        const question = board.mine
          ? `Delete "${board.name}" for everyone? Its tiles, notes and photos go away for anyone with the link. This can't be undone.`
          : `Remove "${board.name}" from your tabs? It stays for everyone else, and opening its link again brings it back.`;
        if (!confirm(question)) return;
        try {
          if (board.mine) await postBoard(board.id, { delete: true });
          applySpace(await postSpace({ remove: board.id }));
          if (!boards.length) await createBoard(currentYear(), blankCells());
        } catch (e) {
          alert("Couldn't do that. Check your connection and try again.");
        }
      });

      const hasLegacyData = () =>
        localStorage.getItem(LEGACY_YEARS_KEY) !== null ||
        localStorage.getItem(legacyStateKey(FIRST_YEAR)) !== null;

      /** Uploads the tabs and photos this browser kept before sync, one board per tab. */
      async function migrateLegacyBoards() {
        const legacyTabs = readJson(LEGACY_YEARS_KEY) || [FIRST_YEAR];
        for (const name of legacyTabs) {
          const saved = readJson(legacyStateKey(name));
          const photos = await loadLegacyPhotos(name);
          if (!saved && photos.size === 0 && name !== FIRST_YEAR) continue;
          const id = newId();
          const cells =
            saved?.cells?.length === GRID_SIZE
              ? saved.cells
              : name === FIRST_YEAR
                ? cellsFromTexts(defaultItems)
                : blankCells();
          for (const [i, blob] of photos) {
            cells[i] = { ...cells[i], photo: await uploadPhoto(id, blob) };
          }
          if (Array.isArray(saved?.claimedLines)) {
            localStorage.setItem(claimedKey(id), JSON.stringify(saved.claimedLines));
          }
          await postBoard(id, { create: { name: String(name).slice(0, MAX_TAB_NAME), cells } });
          await postSpace({ add: id });
        }
      }

      /** Splits an old multi-tab board into one board per tab in this space. Returns false if it doesn't exist. */
      async function migrateOldBoard(id) {
        try {
          await api("migrate", { id, space: spaceId }, { method: "POST" });
          return true;
        } catch (e) {
          if (e.status === 404) return false;
          throw e;
        }
      }

      async function setUpNewSpace() {
        const oldHome = validId(localStorage.getItem(V1_HOME_KEY));
        setStatus("moving your boards…");
        if (oldHome && (await migrateOldBoard(oldHome))) return;
        if (hasLegacyData()) await migrateLegacyBoards();
      }

      /** Adds a shared board to this space's tabs. */
      async function joinBoard(id) {
        try {
          await postSpace({ add: id });
        } catch (e) {
          if (e.status !== 404) throw e;
          if (!(await migrateOldBoard(id))) {
            alert("That board doesn't exist anymore. Someone may have deleted it.");
          }
        }
      }

      async function mergeSpace(otherSpace) {
        const other = await api("space", { space: otherSpace });
        for (const b of other.boards) await postSpace({ add: b.id });
      }

      async function shareUrl(url, copiedLabel, button) {
        const isPhone = matchMedia("(pointer: coarse)").matches;
        if (isPhone && navigator.share) {
          try {
            await navigator.share({ title: document.title, url });
          } catch (e) {}
          return;
        }
        await navigator.clipboard.writeText(url);
        const label = button.textContent;
        button.textContent = copiedLabel;
        setTimeout(() => (button.textContent = label), 2000);
      }

      shareBtn.addEventListener("click", () =>
        shareUrl(`${location.origin}${location.pathname}#b=${activeId}`, "Link copied!", shareBtn),
      );

      devicesBtn.addEventListener("click", () => {
        const ok = confirm(
          "This gives you a private link that opens ALL your boards. Open it on your own phone or laptop. Don't send it to anyone else.",
        );
        if (ok) {
          shareUrl(`${location.origin}${location.pathname}#s=${spaceId}`, "Copied — keep it private", devicesBtn);
        }
      });

      window.addEventListener("hashchange", () => location.reload());

      async function start() {
        const params = new URLSearchParams(location.hash.slice(1));
        const linkedSpace = validId(params.get("s"));
        const linkedBoard = validId(params.get("b"));
        const previousSpace = validId(localStorage.getItem(SPACE_KEY));
        spaceId = linkedSpace || previousSpace || newId();

        const cached = readJson(cacheKey());
        if (Array.isArray(cached)) boards = cached;
        activeId = linkedBoard || pickBoard();
        showBoard();

        try {
          if (linkedSpace && previousSpace && previousSpace !== linkedSpace) {
            await mergeSpace(previousSpace);
          }
          if (!linkedSpace && !previousSpace) await setUpNewSpace();
          if (linkedBoard) await joinBoard(linkedBoard);
          let next = await fetchSpace();
          if (!next.boards.length) {
            await createBoard(currentYear(), blankCells());
            next = await fetchSpace();
          }
          localStorage.setItem(SPACE_KEY, spaceId);
          if (linkedBoard) localStorage.setItem(ACTIVE_BOARD_KEY, linkedBoard);
          applySpace(next);
          setStatus("synced");
        } catch (e) {
          setStatus("offline — showing the last copy this device saw");
        }
        setInterval(poll, POLL_MS);
        document.addEventListener("visibilitychange", poll);
      }

      start();
    </script>
  </body>
</html>
